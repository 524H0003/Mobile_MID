worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # Cấu hình cache cho ảnh
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=images_cache:100m max_size=10g inactive=30d use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        # Cấu hình cho ảnh mẫu
        location /id/ {
            alias /usr/share/nginx/html/images/;

            try_files $uri $uri/ $uri.jpg $uri.png $uri.jpeg $uri.webp $uri.gif =404;

            # Cache ảnh
            proxy_cache images_cache;
            proxy_cache_methods GET HEAD;
            proxy_cache_valid 200 30d;
            proxy_cache_key "$scheme$request_method$uri";

            # Cache headers
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, max-age=31536000, immutable";

            # Giới hạn kích thước response
            client_max_body_size 10m;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}