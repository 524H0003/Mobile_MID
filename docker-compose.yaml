version: "3.8"

services:
  image-provider:
    image: node:18-alpine
    container_name: local-image-provider
    restart: unless-stopped
    ports:
      - "8686:8686"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /app
    volumes:
      - ./server.js:/app/server.js
      - ./package.json:/app/package.json
      - ./cache:/app/cache
    command: sh -c "apk add --no-cache fontconfig && npm install && node server.js"
