version: "3.8"

services:
  image-provider:
    image: node:18-alpine
    container_name: local-image-provider
    restart: unless-stopped
    ports:
      - "8686:80"
    working_dir: /app
    volumes:
      - ./server.js:/app/server.js
      - ./package.json:/app/package.json
    command: sh -c "apk add --no-cache fontconfig && npm install && node server.js"
